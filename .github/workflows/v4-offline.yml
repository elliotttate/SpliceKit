name: v4 offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline, registry and MCP dependencies
        run: python3 -m pip install --only-binary=opentimelineio -r tests/requirements-offline.txt -r mcp/requirements.txt
      - name: Check out the exact upstream adapter used by bundled fixtures
        uses: actions/checkout@v4
        with:
          repository: OpenTimelineIO/otio-fcpx-xml-adapter
          ref: 20d9fa54141149c09d976f3520a8c29d8e5ad124
          path: build/otio-fixture-adapter
          persist-credentials: false
      - name: Build universal SpliceKit library (no deploy)
        run: make -j2
      - name: Validate every live plan without connecting
        run: python3 -m tests.live.run_live --check-plans
      - name: Run all offline tests, including mock RPC acceptance
        env:
          OTIO_PLUGIN_MANIFEST_PATH: ${{ github.workspace }}/build/otio-fixture-adapter/src/otio_fcpxml_adapter/plugin_manifest.json
          OTIO_DISABLE_ENTRYPOINTS_PLUGINS: '1'
        run: make test
